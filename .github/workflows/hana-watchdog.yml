name: HANA Watchdog

on:
  workflow_dispatch:

jobs:
  hana-watchdog:
    runs-on: ubuntu-latest
    environment: "hana secrits"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cloud Foundry CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" \
            | tar -xz

          sudo mv cf8 /usr/local/bin/cf

          cf version

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          jq --version

      - name: Verify environment variables
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_API: ${{ secrets.CF_API }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_SERVICE: ${{ secrets.CF_SERVICE }}
        run: |
          [ -n "$CF_USERNAME" ] && echo "CF_USERNAME: SET" || echo "CF_USERNAME: MISSING"
          [ -n "$CF_PASSWORD" ] && echo "CF_PASSWORD: SET" || echo "CF_PASSWORD: MISSING"
          [ -n "$CF_API" ] && echo "CF_API: SET" || echo "CF_API: MISSING"
          [ -n "$CF_ORG" ] && echo "CF_ORG: SET" || echo "CF_ORG: MISSING"
          [ -n "$CF_SPACE" ] && echo "CF_SPACE: SET" || echo "CF_SPACE: MISSING"
          [ -n "$CF_SERVICE" ] && echo "CF_SERVICE: SET" || echo "CF_SERVICE: MISSING"

      - name: Run HANA Watchdog
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_API: ${{ secrets.CF_API }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_SERVICE: ${{ secrets.CF_SERVICE }}
        run: |
          chmod +x hana-autostart.sh
          ./hana-autostart.sh
